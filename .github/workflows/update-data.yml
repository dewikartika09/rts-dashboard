name: Update data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export data dari Google Sheets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ID_RTS: ${{ secrets.ID_RTS }}
          ID_OUTBOUND: ${{ secrets.ID_OUTBOUND }}
          SHEET_OUTBOUND: ${{ vars.SHEET_OUTBOUND }}
        run: |
          if [ -z "$SHEET_OUTBOUND" ]; then unset SHEET_OUTBOUND; fi
          python export_data.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "chore: update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
